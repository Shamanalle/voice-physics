plugins {
    id 'net.fabricmc.fabric-loom' version '1.18.2'
    id 'java'
}

// The NeoForge hooks are packed into this jar, so their module is configured first
evaluationDependsOn(':neoforge-26')

// Minecraft 26.3 (unobfuscated, no remapping)
def target = "mc26.x"
version = "${project.mod_version}+${target}"

base {
    archivesName = "voice-physics-fabric"
}

repositories {
    mavenCentral()
    maven {
        name = "henkelmax.public"
        url = 'https://maven.maxhenkel.de/repository/public'
    }
    maven {
        name = "TerraformersMC"
        url = 'https://maven.terraformersmc.com/releases'
    }
}

sourceSets {
    main {
        java {
            srcDir "${rootDir}/shared/mc-all/src/main/java"
        }
    }
}

dependencies {
    implementation project(':common')

    minecraft "com.mojang:minecraft:${project.mc26_minecraft}"
    implementation "net.fabricmc:fabric-loader:${project.mc26_fabric_loader}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.mc26_fabric_api}"

    compileOnly "de.maxhenkel.voicechat:voicechat-api:${project.voicechat_api_version}"
    compileOnly "com.terraformersmc:modmenu:${project.mc26_modmenu}"
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

processResources {
    inputs.property "version", project.version

    filesMatching(["fabric.mod.json", "META-INF/*.toml"]) {
        expand "version": project.version
    }
}

jar {
    from project(':common').sourceSets.main.output
    // NeoForge entrypoint: loaded only by NeoForge, which finds it through @Mod
    dependsOn ':neoforge-26:classes'
    from(project(':neoforge-26').sourceSets.main.output) {
        include 'com/kasper/vcdistance/neoforge/**'
    }
}

// The classpath the mod compiles against, one entry per line. The 26.x compatibility check
// (.github/workflows/compat-26.yml) compares the jar against this list for each Minecraft version.
tasks.register('writeCompileClasspath') {
    def out = layout.buildDirectory.file('compile-classpath.txt')
    def files = sourceSets.main.compileClasspath
    outputs.file out
    outputs.upToDateWhen { false }
    doLast {
        out.get().asFile.text = files.files.join('\n') + '\n'
    }
}

// In-game test (Fabric client gametest, run by .github/workflows/ingame.yml): opens the settings screen
// in a real client on every tab and takes screenshots. The test client needs Simple Voice Chat: CI puts
// its jar at build/gametest-mods/voicechat.jar (Loom empties the run folder before every test run).
fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'vc-audio-distance-gametest'
        enableGameTests = false
        enableClientGameTests = true
        eula = true
    }
}

sourceSets {
    gametest {
        java {
            srcDir "${rootDir}/shared/gametest/src/java"
        }
        // The addon's texts: in the dev client ':common' is a plain library, so its assets are not loaded
        resources {
            srcDir "${rootDir}/common/src/main/resources"
            include "assets/**", "fabric.mod.json"
        }
    }
}

def gametestVoicechat = file("${projectDir}/build/gametest-mods/voicechat.jar")
if (gametestVoicechat.exists()) {
    dependencies {
        runtimeOnly files(gametestVoicechat)
    }
}
