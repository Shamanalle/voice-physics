// NeoForge 1.20.4 is built on its own, with Gradle 8 and NeoGradle 7: on that version the game runs
// with SRG names, which NeoGradle remaps to, and the main build's tools start at NeoForge 1.20.5.
// The main build runs this one (buildLegacy in the root build.gradle) and collects its jar.
pluginManagement {
    repositories {
        gradlePluginPortal()
        maven { url = 'https://maven.neoforged.net/releases' }
    }
}

rootProject.name = 'voice-physics-neoforge-1.20.4'
