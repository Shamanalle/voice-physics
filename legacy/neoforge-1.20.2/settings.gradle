// NeoForge 1.20.2 - 1.20.3 is built on its own, with Gradle 8 and NeoGradle 7, like NeoForge 1.20.4: the main
// build's tools start at NeoForge 1.20.5. The main build runs this one (buildLegacy in the root build.gradle)
// and collects its jar. The Gradle wrapper is the one of ../neoforge-1.20.4 (see the root build.gradle).
pluginManagement {
    repositories {
        gradlePluginPortal()
        maven { url = 'https://maven.neoforged.net/releases' }
    }
}

rootProject.name = 'voice-physics-neoforge-1.20.2'
