modLoader = "javafml"
loaderVersion = "[2,)"
license = "MIT"
issueTrackerURL = "https://github.com/Shamanalle/voice-physics/issues"

[[mods]]
modId = "vc_audio_distance"
version = "${version}"
displayName = "Voice Physics"
displayURL = "https://github.com/Shamanalle/voice-physics"
logoFile = "assets/vc-audio-distance/icon.png"
authors = "Shamanalle"
displayTest = "IGNORE_ALL_VERSION"
description = '''
Voices that behave like sound for Simple Voice Chat: they fade with distance, get muffled by walls, come round corners and echo in caves.
Голоса в Simple Voice Chat ведут себя как звук: затихают с расстоянием, глохнут за стенами, доносятся из-за угла и отдаются эхом в пещерах.
'''

# NeoForge 20.2 reads "mandatory", 20.3 and later "type": both are given, each loader ignores the other key
[[dependencies.vc_audio_distance]]
modId = "neoforge"
mandatory = true
type = "required"
versionRange = "[20.2,20.4)"
ordering = "NONE"
side = "BOTH"

[[dependencies.vc_audio_distance]]
modId = "minecraft"
mandatory = true
type = "required"
versionRange = "[1.20.2,1.20.4)"
ordering = "NONE"
side = "BOTH"

[[dependencies.vc_audio_distance]]
modId = "voicechat"
mandatory = true
type = "required"
versionRange = "[1.20.2-2.4.0,)"
ordering = "AFTER"
side = "BOTH"
