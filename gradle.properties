# Gradle
org.gradle.jvmargs=-Xmx2G
# Set up only the modules a task needs: ForgeGradle prepares Minecraft for each Forge module while
# configuring, so ':common:test' or one module's build would otherwise wait for all of them
org.gradle.configureondemand=true
# ForgeGradle 7 (the forge-1.20.6 ... forge-1.21.11 modules), as in Forge's own example project
net.minecraftforge.gradle.merge-source-sets=true

# Mod
mod_version=2.6.1
maven_group=com.kasper.vcdistance

# Shared dependencies
voicechat_api_version=2.6.13
lwjgl_version=3.3.3
slf4j_version=2.0.16

# Bukkit / Spigot / Paper / Purpur 1.20.1+ (Java 17) - server side only
bukkit_api_version=1.20.1-R0.1-SNAPSHOT

# Minecraft 1.20.1 (Java 17)
mc120_minecraft=1.20.1
mc120_fabric_loader=0.16.13
mc120_fabric_api=0.92.12+1.20.1
mc120_modmenu=7.2.2

# Minecraft 1.20.2 - 1.20.4 (Java 17) - compiled against 1.20.4
mc1204_minecraft=1.20.4
mc1204_fabric_loader=0.16.13
mc1204_fabric_api=0.97.3+1.20.4
mc1204_modmenu=9.0.0

# Minecraft 1.20.5 - 1.20.6 (Java 21) - compiled against 1.20.6
mc1206_minecraft=1.20.6
mc1206_fabric_loader=0.16.13
mc1206_fabric_api=0.100.8+1.20.6
mc1206_modmenu=10.0.0

# Minecraft 1.21.x (Java 21) - compiled against 1.21.8, binary-compatible with 1.21 - 1.21.11
mc121_minecraft=1.21.8
mc121_fabric_loader=0.16.13
mc121_fabric_api=0.136.1+1.21.8
mc121_modmenu=15.0.0

# Minecraft 26.x (Java 25, unobfuscated) - compiled against 26.3, runs on 26.1 - 26.3
# (checked on every 26.x release by .github/workflows/compat-26.yml)
mc26_minecraft=26.3
mc26_fabric_loader=0.19.5
mc26_fabric_api=0.161.0+26.3
mc26_modmenu=21.0.0-beta.1
# NeoForge hooks in the 26.x jar (the rest of that jar is shared with Fabric)
nf26_neoforge=26.2.0.88

# Forge 1.20.1 (full addon, forge-1.20.1)
forge120_version=1.20.1-47.4.0
forge120_version_oldest=1.20-46.0.14
# NeoForge for 1.20.1 is a fork of Forge and loads the Forge 1.20.1 jar (net.neoforged:forge)
nf1201_forge=1.20.1-47.1.106

# Forge 1.20.2 - 1.20.4 (full addon, legacy/forge-1.20.4: a build of its own with ForgeGradle 6)
forge1204_version=1.20.4-49.2.8
forge1204_version_oldest=1.20.2-48.1.0

# Forge 1.20.6 and newer: the full addon, one module per band (gradle/forge-band.gradle), compiled
# against the version below and, by .github/workflows/build.yml, against the oldest one (_oldest)
forge1206_version=1.20.6-50.2.10
forge1206_version_oldest=1.20.6-50.2.1
forge121_version=1.21.1-52.1.16
forge121_version_oldest=1.21-51.0.33
forge1215_version=1.21.5-55.1.14
forge1215_version_oldest=1.21.3-53.1.2
forge1218_version=1.21.8-58.1.22
# (not compiled against an older Forge: before 1.21.8-58.1 Forge lacks only the HUD layers event, which the
# addon checks for at run time; the in-game tests start a 1.21.6 server with the same jar)
forge1216_server=1.21.6-56.0.9
forge12110_version=1.21.10-60.1.15
forge12110_version_oldest=1.21.9-59.0.5
forge12111_version=1.21.11-61.2.1
# Forge hooks in the 26.x jar (the rest of that jar is shared with Fabric and NeoForge)
forge26_version=26.3-66.0.6
forge26_version_oldest=26.1-62.0.9

# NeoForge 1.20.4 (full addon, legacy/neoforge-1.20.4: a build of its own with NeoGradle 7)
nf1204_neoforge=20.4.251

# NeoForge 1.20.5 and newer: the full addon, one module per band (gradle/neoforge-band.gradle). Each band is compiled
# against the version below and, by .github/workflows/build.yml, against the oldest one (_oldest;
# NeoForge for 1.20.5 was only ever a beta that the build tools cannot use)
nf1206_neoforge=20.6.141
nf121_neoforge=21.1.172
nf121_neoforge_oldest=21.0.167
nf1215_neoforge=21.5.98
nf1215_neoforge_oldest=21.3.97
nf1218_neoforge=21.8.54
nf1218_neoforge_oldest=21.6.20-beta
nf12110_neoforge=21.10.64
nf12110_neoforge_oldest=21.9.16-beta
nf12111_neoforge=21.11.45
nf12111_neoforge_oldest=21.11.0-beta
