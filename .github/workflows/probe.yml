name: Probe loaders (temporary)

on:
  push:
    branches: [ "claude/addon-analysis-improvement-4olq7u" ]

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
      - name: Forge API 2
        run: |
          exec > probe-forge2.txt 2>&1
          show() { javap -cp "$1" "$2" 2>&1 | grep -v "^Compiled" | head -40; }
          M=https://maven.minecraftforge.net/net/minecraftforge
          for v in 1.20.4-49.2.9 1.20.6-50.2.10 1.21.1-52.1.16 1.21.5-55.1.14 1.21.6-56.0.9 1.21.8-58.1.22 1.21.9-59.0.5 1.21.10-60.1.15 1.21.11-61.2.1 26.3-66.0.6; do
            echo "=================== FORGE $v"
            curl -fsSL -o f.jar "$M/forge/$v/forge-$v-universal.jar" || { echo "no universal"; continue; }
            curl -fsSL -o inst.jar "$M/forge/$v/forge-$v-installer.jar" && unzip -o -q inst.jar version.json install_profile.json 2>/dev/null
            echo "libs: $(jq -r '.libraries[].name' version.json install_profile.json 2>/dev/null | grep -E 'eventbus|fmlcore|javafmllanguage|fmlloader|lowcodelanguage|mclanguage|securemodules|forgespi' | sort -u | tr '\n' ' ')"
            for lib in $(jq -r '.libraries[].name' version.json 2>/dev/null | grep -E 'net.minecraftforge:(eventbus|fmlcore|javafmllanguage|fmlloader):'); do
              g=$(echo $lib | cut -d: -f1 | tr . /); a=$(echo $lib | cut -d: -f2); ver=$(echo $lib | cut -d: -f3)
              curl -fsSL -o "$a.jar" "https://maven.minecraftforge.net/$g/$a/$ver/$a-$ver.jar" || true
            done
            cp="f.jar:eventbus.jar:fmlcore.jar:javafmllanguage.jar:fmlloader.jar"
            for c in net.minecraftforge.client.gui.overlay.ForgeLayeredDraw net.minecraftforge.client.event.RegisterGuiOverlaysEvent net.minecraftforge.client.gui.overlay.IGuiOverlay net.minecraftforge.client.event.ScreenEvent\$Init\$Post net.minecraftforge.client.event.ScreenEvent\$Init net.minecraftforge.event.entity.player.PlayerEvent\$PlayerLoggedInEvent net.minecraftforge.event.RegisterCommandsEvent net.minecraftforge.event.server.ServerStartingEvent net.minecraftforge.client.event.RegisterClientCommandsEvent net.minecraftforge.fml.javafmlmod.FMLJavaModLoadingContext net.minecraftforge.fml.ModLoadingContext net.minecraftforge.fml.ModContainer net.minecraftforge.eventbus.api.bus.EventBus net.minecraftforge.eventbus.api.bus.BusGroup net.minecraftforge.eventbus.api.IEventBus net.minecraftforge.common.MinecraftForge net.minecraftforge.network.NetworkRegistry net.minecraftforge.network.ChannelBuilder net.minecraftforge.network.EventNetworkChannel net.minecraftforge.network.Channel net.minecraftforge.event.network.CustomPayloadEvent net.minecraftforge.event.TickEvent\$ServerTickEvent net.minecraftforge.event.TickEvent\$ClientTickEvent net.minecraftforge.client.event.RegisterKeyMappingsEvent net.minecraftforge.fml.loading.FMLEnvironment net.minecraftforge.server.ServerLifecycleHooks; do
              echo "--- $c"; show "$cp" "$c"
            done
            rm -f eventbus.jar fmlcore.jar javafmllanguage.jar fmlloader.jar version.json install_profile.json
          done
      - name: Save
        if: always()
        run: |
          mkdir -p probe-out && mv probe-*.txt probe-out/ || true
          git config user.name Shamanalle
          git config user.email 123158634+Shamanalle@users.noreply.github.com
          git add probe-out && git commit -m "Probe output (temporary)" && git push origin HEAD:${GITHUB_REF_NAME}
