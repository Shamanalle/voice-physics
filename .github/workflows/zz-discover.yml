name: zz discover NeoForge 20.2 / 20.3

# Temporary: lists the published NeoForge 20.2 / 20.3 builds and their networking API (deleted afterwards)

on:
  push:
    paths: [ ".github/workflows/zz-discover.yml" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Published builds and NeoGradle versions
        run: |
          curl -fsSL https://maven.neoforged.net/releases/net/neoforged/neoforge/maven-metadata.xml -o meta.xml
          echo "20.2 / 20.3 builds:"
          grep -o '<version>20\.[23]\.[^<]*' meta.xml | sed 's/<version>//' | tr '\n' ' '
          echo
          curl -fsSL https://maven.neoforged.net/releases/net/neoforged/gradle/userdev/maven-metadata.xml -o gradle-meta.xml || true
          echo "NeoGradle userdev:"
          grep -o '<version>[^<]*' gradle-meta.xml | sed 's/<version>//' | tr '\n' ' ' || true
          echo
      - name: Networking API of the oldest and newest build of each
        run: |
          for series in 20.2 20.3; do
            list=$(grep -o "<version>${series}\.[^<]*" meta.xml | sed 's/<version>//')
            [ -z "${list}" ] && { echo "no ${series} builds"; continue; }
            for v in $(echo "${list}" | head -1) $(echo "${list}" | tail -1); do
              echo "=================== ${v}"
              curl -fsSL -o "nf-${v}.jar" "https://maven.neoforged.net/releases/net/neoforged/neoforge/${v}/neoforge-${v}-universal.jar" || { echo "no universal jar"; continue; }
              echo "-- network classes:"
              unzip -l "nf-${v}.jar" | awk '{print $4}' | grep -E '^net/neoforged/neoforge/network/[^$]*\.class$' | sort | head -80
              echo "-- overlay / config screen classes:"
              unzip -l "nf-${v}.jar" | awk '{print $4}' | grep -E 'client/gui/overlay/[^$]*\.class$|ConfigScreenHandler\.class$|client/event/RegisterGuiOverlaysEvent' | sort | head -30
              for c in net.neoforged.neoforge.network.NetworkRegistry net.neoforged.neoforge.network.NetworkEvent net.neoforged.neoforge.network.event.EventNetworkChannel net.neoforged.neoforge.network.PacketDistributor net.neoforged.neoforge.network.simple.SimpleChannel net.neoforged.neoforge.network.ChannelBuilder net.neoforged.neoforge.network.registration.IPayloadRegistrar net.neoforged.neoforge.network.event.RegisterPayloadHandlerEvent net.neoforged.neoforge.network.handling.PlayPayloadContext; do
                if unzip -l "nf-${v}.jar" | grep -q "$(echo $c | tr . /).class"; then
                  echo "-- javap ${c}"
                  javap -public -cp "nf-${v}.jar" "${c}" | head -60
                fi
              done
            done
          done
