name: Discover loader versions (temporary)

on:
  push:
    paths: [.github/workflows/zz-discover.yml]

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Exact builds
        run: |
          meta=$(curl -fsSL https://maven.minecraftforge.net/net/minecraftforge/forge/maven-metadata.xml | grep -oP '<version>\K[^<]+')
          echo "Forge 1.20: $(grep '^1\.20-' <<< "${meta}" | sort -V | tr '\n' ' ')"
          echo "Forge 1.21: $(grep '^1\.21-' <<< "${meta}" | sort -V | tr '\n' ' ')"
          echo "Forge 1.20.1 oldest: $(grep '^1\.20\.1-' <<< "${meta}" | sort -V | head -3 | tr '\n' ' ')"
          curl -fsSL https://files.minecraftforge.net/net/minecraftforge/forge/promotions_slim.json | jq -c '.promos | with_entries(select(.key | test("^1\\.2[01]")))'
          echo "Paper API 1.20: $(curl -fsSL https://repo.papermc.io/repository/maven-public/io/papermc/paper/paper-api/maven-metadata.xml | grep -oP '<version>\K1\.20(\.5)?-[^<]+' | tr '\n' ' ')"
          echo "Spigot API: $(curl -fsSL https://hub.spigotmc.org/nexus/content/repositories/snapshots/org/spigotmc/spigot-api/maven-metadata.xml | grep -oP '<version>\K(1\.20|1\.20\.5|1\.21\.2|26\.1)-[^<]+' | tr '\n' ' ')"
