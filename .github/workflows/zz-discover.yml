name: zz discover NeoForge 20.2 / 20.3

# Temporary: lists the published NeoForge 20.2 / 20.3 builds and their networking API (deleted afterwards)

on:
  push:
    paths: [ ".github/workflows/zz-discover.yml" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Builds, artifacts and NeoGradle
        run: |
          curl -fsSL https://maven.neoforged.net/releases/net/neoforged/neoforge/maven-metadata.xml -o meta.xml
          echo "B20.2 builds:"; grep -o '<version>20\.2\.[^<]*' meta.xml | sed 's/<version>//' | tr '\n' ' '; echo
          echo "B20.3 builds:"; grep -o '<version>20\.3\.[^<]*' meta.xml | sed 's/<version>//' | tr '\n' ' '; echo
          echo "Files of 20.2.93:"
          curl -fsSL https://maven.neoforged.net/releases/net/neoforged/neoforge/20.2.93/ | grep -o 'href="[^"]*"' | tr '\n' ' ' || true; echo
          echo "GRADLE userdev versions:"
          curl -fsSL https://maven.neoforged.net/releases/net/neoforged/gradle/net.neoforged.gradle.userdev.gradle.plugin/maven-metadata.xml | grep -o '<version>[^<]*' | sed 's/<version>//' | tr '\n' ' ' || echo "no plugin metadata"; echo
          echo "GRADLE 7.0 pom deps of 20.2.93 (module file):"
          curl -fsSL https://maven.neoforged.net/releases/net/neoforged/neoforge/20.2.93/neoforge-20.2.93.pom | grep -E 'artifactId|version' | head -20 || true
      - name: API of 20.2.93 and 20.3.8-beta
        run: |
          for v in 20.2.93 20.3.8-beta; do
            echo "=================== ${v}"
            curl -fsSL -o "nf-${v}.jar" "https://maven.neoforged.net/releases/net/neoforged/neoforge/${v}/neoforge-${v}-universal.jar"
            for c in net.neoforged.neoforge.network.PlayNetworkDirection net.neoforged.neoforge.network.INetworkDirection net.neoforged.neoforge.network.ICustomPacketPayloadWithBuffer net.neoforged.neoforge.network.custom.payload.SimplePayload net.neoforged.neoforge.network.NetworkEvent 'net.neoforged.neoforge.network.NetworkEvent$Context' 'net.neoforged.neoforge.network.NetworkEvent$ClientCustomPayloadEvent' 'net.neoforged.neoforge.network.NetworkEvent$ServerCustomPayloadEvent' net.neoforged.neoforge.network.PacketDistributor 'net.neoforged.neoforge.network.PacketDistributor$PacketTarget' net.neoforged.neoforge.network.NetworkInstance; do
              echo "-- javap ${c}"
              javap -public -cp "nf-${v}.jar" "${c}" 2>&1 | head -40
            done
          done
