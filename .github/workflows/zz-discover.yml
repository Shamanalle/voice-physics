name: zz discover NeoForge 20.2 / 20.3

# Temporary: reads the client-side sources of NeoForge 20.2 / 20.3 (deleted afterwards)

on:
  push:
    paths: [ ".github/workflows/zz-discover.yml" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Client API from the sources
        run: |
          for v in 20.2.93 20.3.8-beta; do
            echo "=================== ${v}"
            curl -fsSL -o "src-${v}.jar" "https://maven.neoforged.net/releases/net/neoforged/neoforge/${v}/neoforge-${v}-sources.jar"
            mkdir -p "s-${v}" && (cd "s-${v}" && unzip -q -o "../src-${v}.jar")
            for f in $(cd "s-${v}" && find . -name 'RegisterGuiOverlaysEvent.java' -o -name 'ConfigScreenHandler.java' -o -name 'IGuiOverlay.java' -o -name 'RegisterKeyMappingsEvent.java' -o -name 'RegisterClientCommandsEvent.java' | head); do
              echo "-------- ${f}"
              grep -nE 'public |import ' "s-${v}/${f}" | grep -vE 'import (java|org|com)\.' | head -40
            done
            echo "-------- ModLoadingContext / registerExtensionPoint"
            grep -rnE 'registerExtensionPoint' "s-${v}" | head -5
            echo "-------- TickEvent classes"
            grep -rlE 'class TickEvent' "s-${v}" | head -3
            echo "-------- ScreenEvent.Init.Post"
            grep -rnE 'class Post' "s-${v}" | grep -i 'ScreenEvent' | head -3
            echo "-------- Mod constructor injection (FML)"
            grep -rnE 'IEventBus' "s-${v}" | grep -iE 'ModContainer|constructor|getConstructors' | head -5
          done
