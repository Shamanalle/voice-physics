versionRange = "[1.19.4]"
ordering = "NONE"
side = "BOTH"

[[dependencies.vc_audio_distance]]
modId = "voicechat"
mandatory = true
versionRange = "[1.19.4-2.4.0,)"
ordering = "AFTER"
side = "BOTH"
