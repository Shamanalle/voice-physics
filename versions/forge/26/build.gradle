plugins {
    id 'net.minecraftforge.gradle' version '[7.0.17,8)'
    id 'java'
}

// The Forge band of Minecraft 26.x: the code shared with fabric-26 compiled against Forge, with Forge's
// networking from shared/forge. Minecraft 26.x is not obfuscated, so nothing is remapped. Its jar is an
// input of the universal Forge / NeoForge jar (see the root build.gradle), not a release file itself.

version = "${project.mod_version}+mc26.x"

base {
    archivesName = "voice-physics-forge"
}

// The build against the oldest Forge 26.x (.github/workflows/build.yml) passes -PloaderOverride.forge-26=<version>
def forge = project.findProperty("loaderOverride.${project.name}") ?: project.forge26_version

repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    mavenCentral()
    maven {
        name = "henkelmax.public"
        url = 'https://maven.maxhenkel.de/repository/public'
    }
}

def sharedForge = file("${rootDir}/shared/forge/src/main/java")

sourceSets {
    main {
        java {
            srcDir "${rootDir}/shared/mc-all/src/main/java"
            srcDir "${rootDir}/versions/fabric/26/src/main/java"
            srcDir sharedForge
            // From shared/forge only the networking: 26.x has its own permission, language and screen adapters
            exclude { FileTreeElement e ->
                !e.directory && e.file.path.startsWith(sharedForge.path + File.separator)
                        && !e.relativePath.pathString.startsWith('com/kasper/vcdistance/forge/')
            }
            // The Fabric hooks are not needed (and cannot compile) here
            exclude 'com/kasper/vcdistance/AudioDistanceClient.java'
            exclude 'com/kasper/vcdistance/AudioDistanceMod.java'
            exclude 'com/kasper/vcdistance/ModClientNetworking.java'
            exclude 'com/kasper/vcdistance/ModNetworking.java'
            exclude 'com/kasper/vcdistance/ModMenuIntegration.java'
            exclude 'com/kasper/vcdistance/client/HudHook.java'
        }
    }
}

dependencies {
    implementation minecraft.dependency("net.minecraftforge:forge:${forge}")
    implementation project(':common')
    compileOnly "de.maxhenkel.voicechat:voicechat-api:${project.voicechat_api_version}"
}

// Java 21 bytecode, though 26.x runs on Java 25: these classes go into the universal Forge / NeoForge jar,
// and the oldest Forge and NeoForge it supports read every class of the jar with an ASM that stops at Java 21
tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
    // The loader and Minecraft are published for Java 25 only; compiling against them for 21 is fine
    disableAutoTargetJvm()
}

processResources {
    inputs.property "version", project.version
    filesMatching("META-INF/*.toml") {
        expand "version": project.version
    }
}
