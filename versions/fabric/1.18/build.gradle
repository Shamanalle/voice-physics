plugins {
    id 'fabric-loom' version '1.18.2'
    id 'java'
}

// Its jar carries the classes of ':common', so that module is configured first (configure-on-demand)
evaluationDependsOn(':common')

// Minecraft 1.18.2: as 1.19.2 (shared/mc-1.19) plus text components without Component.literal
// (shared/mc-1.18); later roots replace files of the same path in earlier ones
def target = "mc1.18.2"
version = "${project.mod_version}+${target}"

base {
    archivesName = "voice-physics-fabric"
}

repositories {
    mavenCentral()
    maven {
        name = "henkelmax.public"
        url = 'https://maven.maxhenkel.de/repository/public'
    }
    maven {
        name = "TerraformersMC"
        url = 'https://maven.terraformersmc.com/releases'
    }
}

def roots = ["shared/mc-all", "shared/mc-1.20-1.21", "shared/mc-1.19", "shared/mc-1.18"].collect { "${rootDir}/${it}/src/main/java".toString() }
def relative = { String root -> fileTree(root).files.collect { it.path.substring(new File(root).path.length() + 1).replace('\\', '/') } as Set }
def provided = roots.collect { relative(it) }

sourceSets {
    main {
        java {
            roots.each { srcDir it }
            exclude { FileTreeElement e ->
                int i = roots.findIndexOf { e.file.path.startsWith(new File(it).path + File.separator) }
                String path = e.relativePath.pathString
                (i + 1 ..< roots.size()).any { provided[it].contains(path) }
            }
        }
    }
}

dependencies {
    implementation project(':common')

    minecraft "com.mojang:minecraft:${project.mc118_minecraft}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.mc118_fabric_loader}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.mc118_fabric_api}"

    compileOnly "de.maxhenkel.voicechat:voicechat-api:${project.voicechat_api_version}"
    modCompileOnly "com.terraformersmc:modmenu:${project.mc118_modmenu}"
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
    options.encoding = 'UTF-8'
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

processResources {
    inputs.property "version", project.version

    filesMatching(["fabric.mod.json"]) {
        expand "version": project.version
    }
}

jar {
    from project(':common').sourceSets.main.output
}

remapJar {
    archiveClassifier = ''
}
