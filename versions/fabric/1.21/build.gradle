plugins {
    id 'fabric-loom' version '1.18.2'
    id 'java'
}

// Its jar carries the classes of ':common', so that module is configured first (configure-on-demand)
evaluationDependsOn(':common')

// Minecraft 1.21 - 1.21.11 (compiled against 1.21.8, see gradle.properties)
def target = "mc1.21.x"
version = "${project.mod_version}+${target}"

base {
    archivesName = "voice-physics-fabric"
}

repositories {
    mavenCentral()
    maven {
        name = "henkelmax.public"
        url = 'https://maven.maxhenkel.de/repository/public'
    }
    maven {
        name = "TerraformersMC"
        url = 'https://maven.terraformersmc.com/releases'
    }
}

sourceSets {
    main {
        java {
            srcDir "${rootDir}/shared/mc-all/src/main/java"
            srcDir "${rootDir}/shared/mc-1.20-1.21/src/main/java"
        }
    }
}

dependencies {
    implementation project(':common')

    minecraft "com.mojang:minecraft:${project.mc121_minecraft}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.mc121_fabric_loader}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.mc121_fabric_api}"

    compileOnly "de.maxhenkel.voicechat:voicechat-api:${project.voicechat_api_version}"
    modCompileOnly "com.terraformersmc:modmenu:${project.mc121_modmenu}"
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

processResources {
    inputs.property "version", project.version

    filesMatching(["fabric.mod.json", "META-INF/*.toml"]) {
        expand "version": project.version
    }
}

jar {
    from project(':common').sourceSets.main.output
}

remapJar {
    archiveClassifier = ''
}

// In-game test (Fabric client gametest, run by .github/workflows/ingame.yml): opens the settings screen
// in a real client on every tab and takes screenshots. The test client needs Simple Voice Chat: CI puts
// its jar at build/gametest-mods/voicechat.jar (Loom empties the run folder before every test run).
fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'vc-audio-distance-gametest'
        enableGameTests = false
        enableClientGameTests = true
        eula = true
    }
}

sourceSets {
    gametest {
        java {
            srcDir "${rootDir}/shared/gametest/src/java"
        }
        // The addon's texts: in the dev client ':common' is a plain library, so its assets are not loaded
        resources {
            srcDir "${rootDir}/common/src/main/resources"
            include "assets/**", "fabric.mod.json"
        }
    }
}

def gametestVoicechat = file("${projectDir}/build/gametest-mods/voicechat.jar")
if (gametestVoicechat.exists()) {
    dependencies {
        modLocalRuntime files(gametestVoicechat)
    }
}

// The loader's Mixin for 1.21 does not run on Java 25, so the test client runs on Java 21
tasks.matching { it.name == 'runClientGameTest' }.configureEach {
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(21)
    }
}
