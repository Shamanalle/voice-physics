plugins {
    id 'java'
}

// MergeJars: builds the universal jars out of the band jars (see the root build.gradle). It runs on the
// build's own JDK, apart from the Loom / ForgeGradle plugins and the ASM versions they bring along
repositories {
    // Fabric's Maven mirrors ASM like for Loom, so the build gets it from the same place as the rest
    maven { url = uri("https://maven.fabricmc.net/") }
    mavenCentral()
}

dependencies {
    implementation 'org.ow2.asm:asm:9.9.1'
    implementation 'org.ow2.asm:asm-commons:9.9.1'
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
    options.encoding = 'UTF-8'
}
