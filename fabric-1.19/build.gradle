plugins {
    id 'fabric-loom' version '1.18.2'
    id 'java'
}

// Its jar carries the classes of ':common', so that module is configured first (configure-on-demand)
evaluationDependsOn(':common')

// Minecraft 1.19 - 1.19.2: the screens draw with PoseStack (GuiGraphics came in 1.20) and buttons have
// no builder (1.19.3), so the shared files that differ come from shared/mc-1.19 (same path, replaced)
def target = "mc1.19.2"
version = "${project.mod_version}+${target}"

base {
    archivesName = "voice-physics-fabric"
}

repositories {
    mavenCentral()
    maven {
        name = "henkelmax.public"
        url = 'https://maven.maxhenkel.de/repository/public'
    }
    maven {
        name = "TerraformersMC"
        url = 'https://maven.terraformersmc.com/releases'
    }
}

def sharedRoots = ["${rootDir}/shared/mc-all/src/main/java", "${rootDir}/shared/mc-1.20-1.21/src/main/java"]
def ownRoot = "${rootDir}/shared/mc-1.19/src/main/java"
def replaced = fileTree(ownRoot).files.collect { it.path.substring(new File(ownRoot).path.length() + 1).replace('\\', '/') }

sourceSets {
    main {
        java {
            sharedRoots.each { srcDir it }
            srcDir ownRoot
            exclude { FileTreeElement e ->
                replaced.contains(e.relativePath.pathString) && sharedRoots.any { e.file.path.startsWith(new File(it).path) }
            }
        }
    }
}

dependencies {
    implementation project(':common')

    minecraft "com.mojang:minecraft:${project.mc119_minecraft}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.mc119_fabric_loader}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.mc119_fabric_api}"

    compileOnly "de.maxhenkel.voicechat:voicechat-api:${project.voicechat_api_version}"
    modCompileOnly "com.terraformersmc:modmenu:${project.mc119_modmenu}"
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
    options.encoding = 'UTF-8'
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

processResources {
    inputs.property "version", project.version

    filesMatching(["fabric.mod.json"]) {
        expand "version": project.version
    }
}

jar {
    from project(':common').sourceSets.main.output
}

remapJar {
    archiveClassifier = ''
}
