plugins {
    id 'java'
    // Puts bStats into the plugin jar under our own package name
    id 'com.gradleup.shadow' version '9.0.0'
}

// This build script reads common's source set, and ':bukkit' is configured before ':common'
evaluationDependsOn(':common')

// Bukkit, Spigot, Paper and Purpur 1.20+: the server side only (there is no client on Bukkit).
// Compiled against the 1.20.1 API and uses only API that later versions still have.
version = project.mod_version

base {
    archivesName = "voice-physics-bukkit"
}

repositories {
    mavenCentral()
    maven {
        name = "papermc"
        url = 'https://repo.papermc.io/repository/maven-public/'
    }
    maven {
        name = "henkelmax.public"
        url = 'https://maven.maxhenkel.de/repository/public'
    }
    maven {
        name = "placeholderapi"
        url = 'https://repo.extendedclip.com/releases/'
        content { includeGroup 'me.clip' }
    }
}

configurations {
    // What goes into the plugin jar besides the common code
    bundled
}

dependencies {
    implementation project(':common')
    bundled "org.bstats:bstats-bukkit:3.1.0"
    compileOnly "org.bstats:bstats-bukkit:3.1.0"

    compileOnly "io.papermc.paper:paper-api:${project.bukkit_api_version}"
    compileOnly "de.maxhenkel.voicechat:voicechat-api:${project.voicechat_api_version}"
    // Optional: %vcd_...% placeholders when PlaceholderAPI is installed
    compileOnly("me.clip:placeholderapi:2.11.6") { transitive = false }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
    options.encoding = 'UTF-8'
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

processResources {
    inputs.property "version", project.version
    filesMatching("plugin.yml") {
        expand "version": project.version
    }
}

// The plugin jar: the common code with the language files (/vcd replies and messages to players come
// from them; the icon is for the client only) and bStats, moved to our own package so it cannot clash
// with another plugin's copy.
tasks.named('jar') {
    enabled = false
    dependsOn 'shadowJar'
}
tasks.named('shadowJar') {
    archiveClassifier = ''
    configurations = [project.configurations.bundled]
    from(sourceSets.main.output)
    from(project(':common').sourceSets.main.output) {
        exclude 'assets/vc-audio-distance/icon.png'
    }
    relocate 'org.bstats', 'com.kasper.vcdistance.libs.bstats'
    // bStats brings its own licence file; keep the jar free of build metadata
    exclude 'META-INF/maven/**', 'META-INF/versions/**/module-info.class', 'module-info.class'
}

// Guards the jar against losing the texts again: without them every server message is a bare key
tasks.register('checkPluginJar') {
    def jarFile = tasks.named('shadowJar').flatMap { it.archiveFile }
    inputs.file jarFile
    doLast {
        def names = new java.util.zip.ZipFile(jarFile.get().asFile).withCloseable { zip -> zip.entries().collect { it.name } }
        for (String required : ['plugin.yml', 'assets/vc-audio-distance/lang/en_us.json', 'assets/vc-audio-distance/lang/ru_ru.json',
                                'com/kasper/vcdistance/ServerText.class']) {
            if (!names.contains(required)) {
                throw new GradleException("The plugin jar lacks " + required)
            }
        }
    }
}
tasks.named('build') { dependsOn 'checkPluginJar' }
tasks.named('checkPluginJar') { dependsOn 'shadowJar' }

// The Paper API the plugin is checked against by .github/workflows/compat-bukkit.yml: the plugin jar,
// built against bukkit_api_version, must link against every later Paper release the same way.
// -PcompatPaperApi=<paper-api version> picks the version; newer ones need Java 21 or 25, so the
// configuration asks for the newest Java instead of the plugin's own 17.
configurations {
    compatPaper {
        canBeConsumed = false
        canBeResolved = true
        attributes {
            attribute(Usage.USAGE_ATTRIBUTE, objects.named(Usage, Usage.JAVA_API))
            attribute(Category.CATEGORY_ATTRIBUTE, objects.named(Category, Category.LIBRARY))
            attribute(LibraryElements.LIBRARY_ELEMENTS_ATTRIBUTE, objects.named(LibraryElements, LibraryElements.JAR))
            attribute(Bundling.BUNDLING_ATTRIBUTE, objects.named(Bundling, Bundling.EXTERNAL))
            attribute(TargetJvmVersion.TARGET_JVM_VERSION_ATTRIBUTE, 25)
        }
    }
}

dependencies {
    compatPaper "io.papermc.paper:paper-api:${project.findProperty('compatPaperApi') ?: project.bukkit_api_version}"
    compatPaper "de.maxhenkel.voicechat:voicechat-api:${project.voicechat_api_version}"
}

tasks.register('writeCompatClasspath') {
    def out = layout.buildDirectory.file('compat-classpath.txt')
    def files = configurations.compatPaper
    outputs.file out
    outputs.upToDateWhen { false }
    doLast {
        out.get().asFile.text = files.files.join('\n') + '\n'
    }
}

